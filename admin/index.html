    <!-- Fallback for the brief pre-hydration window / non-JS crawlers.
         Every route sets its own real title/description/OG/Twitter tags via
         the <SEO> component (react-helmet-async) once React mounts — keeping
         a second static copy of those tags here would leave two conflicting
         <meta> entries in the DOM permanently, since Helmet only manages tags
         it renders itself and never removes ones already in the static HTML. -->
    <title>E-Commerce</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
